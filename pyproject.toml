# Packaging of CRONOS for PyPI (2026-10-07).  This file describes the DEFAULT distribution, cronos-mcpp, under EPL-2.0:
# it links no GPL component (UMFPACK and SPQR, both GPL-2.0-or-later, are off).  The GPL distribution, with UMFPACK
# and SPQR, is derived from it by tools/wheel_variant.py, under the SAME name: its wheels carry a build tag and are
# published as GitHub Release assets, never on PyPI (see .github/workflows/wheels.yml and INSTALL.md).
[build-system]
requires = [
  "scikit-build-core>=0.10",
  # The SAME pybind11 release as the pymcpp wheels: objects cross between the two modules, and mixed releases break
  # that exchange.  Not 3.1.0 (its keep_alive regression).
  "pybind11==3.0.4",
  "pybind11-stubgen>=2.5",
  # The type stub is generated by importing the freshly built cronos module, which imports pymcpp and numpy.
  "pymcpp==5.0.3",                      # PREREQUISITE: the next MC++ release (5.0.2 lacks FFDom and the FF* bindings)
  "numpy>=1.23",
]
build-backend = "scikit_build_core.build"

[project]
name = "cronos-mcpp"                    # "cronos" is taken on PyPI; the module still imports as `cronos`
version = "5.0.0"                       # keep equal to cronos.__version__ (src/interface/cronos.cpp)
description = "Simulation and sensitivity analysis of ODE, DAE and PDE models on MC++ factorable-function DAGs"
readme = "README.md"
license = "EPL-2.0"                     # GPL-2.0-or-later is a Secondary License (see LICENSE): the GPL build
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.txt"]
requires-python = ">=3.10"
authors = [{ name = "Benoit C. Chachuat", email = "b.chachuat@imperial.ac.uk" }]
keywords = ["ODE", "DAE", "PDE", "orthogonal collocation", "sensitivity analysis", "optimal control", "MC++"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Programming Language :: C++",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Mathematics",
]
# pymcpp: the SAME release the wheels are built against (shared types cross between the modules)
dependencies = ["pymcpp==5.0.3", "numpy>=1.23"]

[project.urls]
Homepage = "https://github.com/omega-icl/cronos"
Source = "https://github.com/omega-icl/cronos"
Issues = "https://github.com/omega-icl/cronos/issues"

[tool.scikit-build]
minimum-version = "0.10"
cmake.version = ">=3.18"
build.verbose = true
install.components = ["python_modules"]   # the module and its stub only (not the headers)
wheel.packages = []
sdist.exclude = [".github", "build", "build-*", "build_*", "dist", ".cache", "docs/html", "test"]

[tool.scikit-build.cmake.define]
ENABLE_EXAMPLES = "OFF"
CRONOS_INSTALL_DIR = "."
CRONOS_WITH_KLU = "ON"                  # SuiteSparse KLU/BTF: LGPL-2.1-or-later, linked dynamically
CRONOS_WITH_UMFPACK = "OFF"             # GPL-2.0-or-later: the GPL distribution only
CRONOS_WITH_SPQR = "OFF"                # GPL-2.0-or-later: the GPL distribution only
